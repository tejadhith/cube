[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twisty"
version = "0.1.3"
description = "Partially-observable twisty puzzle environment as MCP tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.26.0",
    "magiccube>=1.2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
cube-server = "cube.server:main"

[tool.setuptools]
include-package-data = true
packages = ["cube"]
