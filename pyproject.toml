[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cube-mcp"
version = "0.1.0"
description = "Partially-observable Rubik cube POMDP MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.26.0",
    "magiccube>=1.2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
cube-server = "cube.server:main"
cube-dev = "cube.server:dev"

[tool.setuptools]
include-package-data = true
packages = ["cube"]
